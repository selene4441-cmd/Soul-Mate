map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream tongpin_api {
    server tongpin-api:8000;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name app.example.com;

    # TLS、WAF 和证书配置由部署平台或基础镜像负责。
    location /api/v1/ {
        proxy_pass http://tongpin_api/api/v1/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 同频的会话、CSRF、幂等键和追踪头必须保留。
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_set_header Idempotency-Key $http_idempotency_key;
        proxy_set_header X-Session-Id $http_x_session_id;
        proxy_set_header X-Trace-ID $http_x_trace_id;

        # 不改写 Set-Cookie，避免会话 Cookie 丢失。
        proxy_pass_request_headers on;

        # WebSocket 与 SSE 均通过该路径。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}