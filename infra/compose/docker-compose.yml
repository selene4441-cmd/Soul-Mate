services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tongpin
      POSTGRES_USER: tongpin
      POSTGRES_PASSWORD: tongpin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tongpin -d tongpin"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../..
      dockerfile: infra/deploy/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://tongpin:tongpin@postgres:5432/tongpin
      REDIS_URL: redis://redis:6379/0
      COOKIE_SECURE: "true"
      SEED_DEMO_DATA: "true"
      AUTO_CREATE_DB: "false"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: infra/deploy/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://tongpin:tongpin@postgres:5432/tongpin
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-l", "INFO"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/deploy/web.Dockerfile
    environment:
      API_ORIGIN: http://backend:8000
      NEXT_PUBLIC_API_BASE: /api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
